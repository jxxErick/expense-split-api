server:
  # 8080 is the customer-api; both run side by side for the web front-end
  port: ${PORT:8081}

spring:
  application:
    name: expense-split-api
  datasource:
    url: jdbc:h2:mem:expensesplit;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

cors:
  # comma-separated; the Angular dev server by default
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
